<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đếm thời gian đã qua</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:system-ui,-apple-system,sans-serif;
background:linear-gradient(135deg,#5f9cff,#7b5bff,#ff6ec7);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
padding:15px;
}

.container{
width:100%;
max-width:420px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(14px);
border-radius:18px;
padding:22px;
box-shadow:0 12px 40px rgba(0,0,0,0.35);
border:1px solid rgba(255,255,255,0.2);
text-align:center;
}

h1{
margin:10px 0 20px;
font-size:1.6rem;
}

input{
width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:none;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.card{
background:rgba(255,255,255,0.15);
padding:14px;
border-radius:12px;
}

.number{
font-size:22px;
font-weight:700;
}

.label{
font-size:13px;
opacity:0.85;
}

.big{
grid-column:span 2;
background:rgba(0,0,0,0.25);
}

footer{
margin-top:15px;
font-size:12px;
opacity:0.8;
}

</style>
</head>

<body>

<div class="container">

<h1>⏳ Thời gian đã trôi qua</h1>

<input type="date" id="startDate">

<div id="result" class="grid">

<div class="card big">
<div class="number">--</div>
<div class="label">Tổng số ngày</div>
</div>

</div>

<footer>Cập nhật mỗi giây</footer>

</div>

<script>

const startDateInput = document.getElementById("startDate");
const result = document.getElementById("result");

let saved = localStorage.getItem("countFromDate");
if(saved) startDateInput.value = saved;

function update(){

const start = new Date(startDateInput.value);
if(isNaN(start)) return;

const now = new Date();
let diff = now - start;

if(diff<0) return;

const seconds = Math.floor(diff/1000);
const minutes = Math.floor(seconds/60);
const hours = Math.floor(minutes/60);
const days = Math.floor(hours/24);

const years = Math.floor(days/365.25);
let remainDays = Math.floor(days - years*365.25);

const months = Math.floor(remainDays/30.437);
remainDays = Math.floor(remainDays - months*30.437);

const h = hours%24;
const m = minutes%60;
const s = seconds%60;

result.innerHTML=`

<div class="card big">
<div class="number">${days}</div>
<div class="label">Tổng số ngày</div>
</div>

<div class="card">
<div class="number">${years}</div>
<div class="label">Năm</div>
</div>

<div class="card">
<div class="number">${months}</div>
<div class="label">Tháng</div>
</div>

<div class="card">
<div class="number">${remainDays}</div>
<div class="label">Ngày</div>
</div>

<div class="card">
<div class="number">${h}</div>
<div class="label">Giờ</div>
</div>

<div class="card">
<div class="number">${m}</div>
<div class="label">Phút</div>
</div>

<div class="card">
<div class="number">${s}</div>
<div class="label">Giây</div>
</div>

`;

}

startDateInput.addEventListener("change",()=>{
localStorage.setItem("countFromDate",startDateInput.value);
update();
});

setInterval(update,1000);
update();

</script>

</body>
</html>
